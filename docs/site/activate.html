<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Activate your device | Basha Player</title>
<meta name="theme-color" content="#060A13">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="portal.css">
</head>
<body>
<script>if(location.search.indexOf('x')>-1)document.documentElement.classList.add("nofx")</script>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>
<header class="nav">
  <a class="brand" href="index.html"><img src="logo.svg" alt="" width="36" height="36"><span>Basha <b>Player</b></span></a>
  <nav class="links"><a href="index.html#features" data-t="nav_features"></a><a href="index.html#pricing" data-t="nav_pricing"></a><a href="index.html#faq" data-t="nav_faq"></a></nav>
  <div class="tools">
    <div class="lang"><button type="button" data-lang="en" class="on">EN</button><button type="button" data-lang="ar">ع</button><button type="button" data-lang="de">DE</button></div>
    <a class="btn btn-ghost sm on" href="activate.html" data-t="nav_activate"></a>
  </div>
</header>

<main class="pmain">
  <div class="demo-banner" data-t="demo"></div>

  <!-- LOGIN -->
  <section id="login" class="login reveal in">
    <div class="login-card">
      <img src="logo.svg" alt="" width="64" height="64">
      <h1 data-t="l_h"></h1>
      <p class="sub" data-t="l_p"></p>
      <form id="loginForm" autocomplete="off" novalidate>
        <label><span data-t="l_mac"></span>
          <input id="mac" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="AA:BB:CC:DD:EE:FF" maxlength="17">
        </label>
        <label><span data-t="l_key"></span>
          <input id="key" inputmode="text" spellcheck="false" placeholder="••••••" maxlength="6">
        </label>
        <p class="err" id="err" role="alert"></p>
        <button class="btn btn-gold lg" type="submit" data-t="l_btn"></button>
      </form>
      <details class="help"><summary data-t="l_help"></summary><p data-t="l_help_p"></p></details>
      <small class="tiny" data-t="l_demo"></small>
    </div>
  </section>

  <!-- PORTAL -->
  <section id="portal" class="portal" hidden>
    <aside class="side">
      <div class="who"><span class="avatar" id="avatar">B</span><div><small data-t="s_device"></small><b id="macShow" dir="ltr"></b></div></div>
      <button type="button" class="si on" data-view="account"><i class="ic" data-ic="user"></i><span data-t="s_account"></span></button>
      <button type="button" class="si" data-view="activate"><i class="ic" data-ic="bolt"></i><span data-t="s_activate"></span></button>
      <button type="button" class="si" data-view="key"><i class="ic" data-ic="key"></i><span data-t="s_key"></span></button>
      <button type="button" class="si" data-view="playlists"><i class="ic" data-ic="list"></i><span data-t="s_playlists"></span></button>
      <button type="button" class="si" data-view="pin"><i class="ic" data-ic="lock"></i><span data-t="s_pin"></span></button>
      <button type="button" class="si out" id="logout"><i class="ic" data-ic="out"></i><span data-t="s_logout"></span></button>
    </aside>

    <div class="pane">
      <!-- account -->
      <div class="view" id="v-account">
        <h2 data-t="a_h"></h2>
        <div class="acc-grid">
          <div class="ring-card">
            <div class="ring" id="ring"><svg viewBox="0 0 120 120"><circle class="rb" cx="60" cy="60" r="52"/><circle class="rf" id="rf" cx="60" cy="60" r="52"/></svg><div class="rc"><b id="days">5</b><small data-t="a_days"></small></div></div>
            <span class="status trial" id="statusBadge" data-t="st_trial"></span>
          </div>
          <dl class="facts">
            <div><dt data-t="a_mac"></dt><dd dir="ltr" id="fMac"></dd></div>
            <div><dt data-t="a_status"></dt><dd id="fStatus" data-t="st_trial"></dd></div>
            <div><dt data-t="a_start"></dt><dd id="fStart"></dd></div>
            <div><dt data-t="a_exp"></dt><dd id="fExp"></dd></div>
            <div><dt data-t="a_plan"></dt><dd data-t="a_plan_v"></dd></div>
          </dl>
        </div>
        <div class="callout"><span data-t="a_note"></span><button class="btn btn-gold sm" type="button" data-go="activate" data-t="a_cta"></button></div>
      </div>

      <!-- activate -->
      <div class="view" id="v-activate" hidden>
        <h2 data-t="p_h"></h2>
        <p class="sub" data-t="p_p"></p>
        <div class="plans" id="plans">
          <button type="button" class="plan2" data-plan="year"><b data-t="plan1"></b><span class="pr"><i>€</i>5<small data-t="per_year"></small></span><em data-t="p_year_d"></em></button>
          <button type="button" class="plan2 on" data-plan="life"><span class="tag" data-t="best"></span><b data-t="plan2"></b><span class="pr"><i>€</i>10<small data-t="once"></small></span><em data-t="p_life_d"></em></button>
        </div>
        <h3 data-t="p_method"></h3>
        <div class="methods" id="methods">
          <button type="button" class="meth on" data-m="card"><span class="mi">VISA</span><b data-t="m_card"></b><small data-t="m_card_d"></small></button>
          <button type="button" class="meth" data-m="paypal"><span class="mi pp">PayPal</span><b>PayPal</b><small data-t="m_pp_d"></small></button>
          <button type="button" class="meth" data-m="code"><span class="mi cd">#</span><b data-t="m_code"></b><small data-t="m_code_d"></small></button>
        </div>
        <div class="code-box" id="codeBox" hidden><label><span data-t="c_l"></span><input id="codeIn" placeholder="XXXX-XXXX-XXXX" dir="ltr"></label></div>
        <label class="ck"><input type="checkbox" id="ck"><span data-t="p_ck"></span></label>
        <p class="note2" data-t="p_note"></p>
        <div class="sum"><span data-t="p_total"></span><b id="total">€10</b></div>
        <button class="btn btn-gold lg full" type="button" id="payBtn" data-t="p_pay"></button>
        <p class="support"><span data-t="p_help"></span> <a href="#" data-t="p_wa"></a></p>
      </div>

      <!-- key -->
      <div class="view" id="v-key" hidden>
        <h2 data-t="k_h"></h2>
        <p class="sub" data-t="k_p"></p>
        <div class="keybox"><div><small data-t="k_cur"></small><b id="curKey" dir="ltr">••••••</b></div>
          <button class="btn btn-ghost sm" type="button" id="keyShow" data-t="k_show"></button></div>
        <div class="ff-row"><label class="ff"><span data-t="k_new"></span><input id="newKey" maxlength="6" placeholder="••••••"></label>
          <button class="btn btn-ghost sm" type="button" id="keyRand" data-t="k_rand"></button></div>
        <p class="note2" data-t="k_note"></p>
        <button class="btn btn-gold" type="button" id="keySave" data-t="k_save"></button>
        <p class="ok" id="keyOk" hidden data-t="k_ok"></p>
      </div>

      <!-- playlists -->
      <div class="view" id="v-playlists" hidden>
        <h2 data-t="pl_h"></h2>
        <p class="sub" data-t="pl_p"></p>
        <div class="pl-list" id="plList"></div>
        <div class="pl-form" id="plForm">
          <h3 id="plFormT" data-t="pl_add"></h3>
          <div class="seg" id="plType"><button type="button" class="on" data-pt="link" data-t="pl_t_link"></button><button type="button" data-pt="login" data-t="pl_t_login"></button></div>
          <label class="ff w"><span data-t="pl_name"></span><input id="plName" maxlength="30" placeholder="My playlist" dir="auto"></label>
          <label class="ff w" id="plUrlW"><span data-t="pl_url"></span><input id="plUrl" placeholder="https://example.com/list.m3u" dir="ltr"></label>
          <div id="plLoginW" hidden>
            <label class="ff w"><span data-t="pl_host"></span><input id="plHost" placeholder="http://example.com:8080" dir="ltr"></label>
            <div class="two"><label class="ff w"><span data-t="pl_user"></span><input id="plUser" dir="ltr"></label><label class="ff w"><span data-t="pl_pass"></span><input id="plPass" type="password" dir="ltr"></label></div>
          </div>
          <p class="note2" data-t="pl_note"></p>
          <p class="err" id="plErr"></p>
          <div class="btnrow"><button class="btn btn-gold" type="button" id="plSave" data-t="pl_save"></button><button class="btn btn-ghost" type="button" id="plCancel" data-t="pl_cancel" hidden></button></div>
        </div>
      </div>

      <!-- parent pin -->
      <div class="view" id="v-pin" hidden>
        <h2 data-t="pin_h"></h2>
        <p class="sub" data-t="pin_p"></p>
        <div class="switch-row"><div><b data-t="pin_on"></b><small data-t="pin_on_d"></small></div><button type="button" class="tgl" id="pinTgl" aria-pressed="false"><i></i></button></div>
        <div id="pinFields" hidden>
          <div class="two"><label class="ff w"><span data-t="pin_new"></span><input id="pin1" inputmode="numeric" maxlength="4" placeholder="••••" type="password"></label>
          <label class="ff w"><span data-t="pin_conf"></span><input id="pin2" inputmode="numeric" maxlength="4" placeholder="••••" type="password"></label></div>
          <label class="ck"><input type="checkbox" id="pinLists" checked><span data-t="pin_c1"></span></label>
          <label class="ck"><input type="checkbox" id="pinSet" checked><span data-t="pin_c2"></span></label>
          <p class="err" id="pinErr"></p>
          <button class="btn btn-gold" type="button" id="pinSave" data-t="pin_save"></button>
        </div>
        <p class="ok" id="pinOk" hidden data-t="pin_ok"></p>
      </div>

      <div class="view" id="v-soon" hidden>
        <h2 data-t="soon_h"></h2><p class="sub" data-t="soon_p"></p>
      </div>
    </div>
  </section>

  <!-- success overlay -->
  <div class="done" id="done" hidden>
    <div class="done-card">
      <svg viewBox="0 0 80 80" class="tick"><circle cx="40" cy="40" r="34"/><path d="M26 41l10 10 19-21"/></svg>
      <h2 data-t="d_h"></h2><p data-t="d_p"></p>
      <button class="btn btn-gold" type="button" id="doneBtn" data-t="d_btn"></button>
    </div>
  </div>
</main>
<script src="activate.js"></script>
</body>
</html>
